[project]
name = "gsm"
version = "0.1.0"
description = "Python module for covariate-dependent smooth mixture models"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
    "optax",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gsm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
